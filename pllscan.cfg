; pllscan.cfg — runtime configuration for pllscan.exe
; Place this file in the same directory as pllscan.exe.

[Paths]
; Full paths to the database files.
; Leave empty to use the default: same directory as pllscan.exe.
ChipsetsDb=
BoardsDb=
PllChipsDb=

[BoardDb]
; Comma-separated board clock labels parsed from Boards.ini sections.
ClockLabels=HT,PCIe,CPURef,MemRef,FSB

[Selection]
; Set by "pllscan board select <name>". Do not edit by hand unless necessary.
Board=
