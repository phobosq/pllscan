; Chipsets.ini — pllscan external chipset database
; Section = VendorId:DeviceId (hex, no 0x prefix)
; Type            = runtime chipset key used by platform/board identity
; SmbusSlotDev/Fn  = PCI device:function that holds the SMBus I/O BAR
; SmbusBarOffset   = config space offset of the BAR register (hex)
; SmbusBarMask     = bitmask to extract base address (hex, typically FFE0)
; SmbPollTimeout   = host-status poll iterations before timeout (decimal)
; SmbYieldEvery    = iteration cadence for Sleep(0) during polls (decimal)
; SmbRecoverPolls  = HOST_BUSY recovery poll iterations after KILL (decimal)
;
; Entries here take precedence over the compiled-in static table.

